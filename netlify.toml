[build]
  command = "npm run build"
  publish = "dist"

# Security headers for every response.
#
# The content security policy allows only what the page uses: its own scripts and styles, the
# WebAssembly of the `opengov` library, the GitHub API for releases, and WebSocket connections to
# the RPC providers listed in `src/chains.ts`. An endpoint of a provider that is not listed in
# `connect-src` here is blocked by the browser, so keep the two in step. Inline style attributes
# are allowed because the progress bars set their width that way.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = """\
      default-src 'self'; \
      script-src 'self' 'wasm-unsafe-eval'; \
      style-src 'self' 'unsafe-inline'; \
      img-src 'self' data:; \
      connect-src 'self' https://api.github.com \
        wss://*.polkadot.io wss://*.dwellir.com wss://*.luckyfriday.io wss://*.ibp.network \
        wss://*.onfinality.io wss://kusama.api.encointer.org wss://spectrum-03.simplystaking.xyz; \
      object-src 'none'; \
      base-uri 'self'; \
      form-action 'self'; \
      frame-ancestors 'none'"""
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

# Vite names these files by a hash of their content, so a given name never changes.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
